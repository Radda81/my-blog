<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2048</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-wrap">
    <h1 class="title">2048</h1>

    <div class="scoreboard">
      <div class="score-box">
        <div class="score-label">SCORE</div>
        <div class="score-value" id="score">0</div>
      </div>
      <div class="score-box">
        <div class="score-label">BEST</div>
        <div class="score-value" id="best-score">0</div>
      </div>
    </div>

    <div class="controls">
      <button id="new-game-btn" class="btn">New Game</button>
    </div>

    <p class="instructions">
      방향키로 타일을 이동하세요 (모바일에서는 스와이프). 같은 숫자 타일이 만나면 합쳐집니다. 2048 타일을 만들면 승리!
    </p>

    <div class="board-container">
      <div class="board" id="board">
        <!-- 배경 셀 4x4 -->
        <div class="grid-cells" id="grid-cells"></div>
        <!-- 타일이 렌더링되는 레이어 -->
        <div class="tile-layer" id="tile-layer"></div>

        <div class="overlay" id="overlay" hidden>
          <div class="overlay-content">
            <p class="overlay-message" id="overlay-message"></p>
            <div class="overlay-buttons">
              <button id="keep-playing-btn" class="btn" hidden>계속하기</button>
              <button id="restart-btn" class="btn btn-primary">다시 시작</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
